# encoding:utf-8
patch:
  # 运行态气泡图标：小狼毫 WeaselServer 读 schema/zhung_icon(中) / schema/icon /
  # schema/ascii_icon(英) / full_icon / half_icon（今晚从 WeaselServer.exe 的字符串表实测）。
  # 只影响气泡图标，不动候选、不动码表。文件名相对「用户资料夹」根目录。
  switches/+: #增加以下开关
    - name: encnDic                    # 中英字典开关
      reset: 1
      states: [Off, 中英对照]
    - name: phraseReplace            # 敏感词输出开关
      reset: 0            # DSH 2026-10-15：关，否则 phraseReplace.txt 里空值的词（如「屌」）被打成 *
      states: [Off, 👙]
    - name: pinyin                    # 这个开关用于标记是否打开拼音滤镜
      reset: 0
      states: [Off, pīnyīn]
    - name: phraseExt                # 候选词扩展开关
      reset: 1
      states: [Off, phraseExt]
    - name: phraseComment            # 候选词注释开关
      reset: 1
      states: [Off, commentOn]
    - name: markdown                    # 一个markdown语法开关
      reset: 0
      states: [Off, md]
    - name: abbrEn                    # 流行固定英文缩写候选（v1.10，三生自研滤镜）
      reset: 1
      states: [Off, 缩写]
  engine/translators/+:  #增加以下translator
    - table_translator@custom_phrase  # 指定使用 custom_phrase 进行输入字符的翻译
    - lua_translator@rawEcho_translator    # v1.10.1：/5g /ri0977 这类含数字原文串
    - script_translator@pinyin  # M5/D-012：拼音逐字+整句候选（词典 pinyin_simp）；五笔 table 不动
    - table_translator@en_word    # H-260(CodeArts): v38 C++ table_translator 方案（Qoder 已准备 en_word.dict.yaml + en_word.schema.yaml）
    # - lua_translator@enWord_translator    # H-260(CodeArts): v37 注释——translator 方案卡顿，换 filter
  # M5（D-012/H-066）：26 键拼音以前只靠 wubi86 的整词拼音表，nihao 仅 1 条「你好」。
  # 这里把 pinyin_simp 接成真正的拼音翻译器：逐字/词组/整句都有，T9 与 26 键体验一致。
  # enable_user_dict 关：学习仍归五笔 table 的 user 词典，避免同一输入双写两本用户词典。
  pinyin:
    dictionary: pinyin_simp
    enable_completion: true
    enable_sentence: true
    enable_user_dict: false
    initial_quality: 0
    preedit_format:
      - xform/([nl])v/$1ü/
      - xform/([nl])ue/$1üe/
      - xform/([jqxy])v/$1u/
  engine/filters:                                    # 设置以下filter（简繁开关 zh_trad 定义在基础 schema）
    - simplifier@tradition                        # 简繁转换（三生输入法·简繁反查；基础 schema 已定义 zh_trad 开关 + tradition 块）
    - lua_filter@inputShow_Filter                    # 这个过滤器用于在特定场景下，增加候选项
    - lua_filter@phraseExt_Filter                    # 自定义短语滤镜，针对响应的关键字，添加新的选项进来
    - lua_filter@dateTime_Filter                    # 时间信息，对于特定的时间或者事件关键字，添加时间信息，例如日期，今天，明天，肝炎，父亲等
    - lua_filter@dynamicPhrase_Filter                # 动态候选项，用于动态获取与运行环境有关的信息
    # 上面的滤镜会调整候选词选项，或者增加，或者减少。原则上说，减少的滤镜，请放在前端
    - lua_filter@phraseReplace_Filter                # 词语替换滤镜，针对一些指定的关键字，将其替换为指定的内容，或者当没有指定内容时，替换为 *
    # 上面的滤镜会减少或者改变候先词选项
    - uniquifier                                    # 过滤重复候选项，依赖 simplifier
    # 下面的滤镜是comment滤镜，不会改变候选项列表
    - lua_filter@dic_4w_Filter                        # 英中对照滤镜
    - lua_filter@phraseComment_Filter                # 短语释义
    - lua_filter@pinyinAdding_Filter                # pinyin滤镜，用于对候选项中的字添加拼音
    - lua_filter@codeLookup_Filter     # 编码反查+多音字注释（三生独立滤镜，不改动 inputShow_Filter）
    # M-235(Qoder) 拍板 2026-10-26(CodeArts 落行)：laneChangeAndSpace_Filter 是桌面版口径——150 字符上限 +
    # <br> 转真换行，手机上把一个候选撑成 3 行。换手机版 phoneComment_Filter：显示宽度 20、从右截，
    # 前置写入 comment 的 [编码]/拼音永远先保住。除本行外不改任何滤镜顺序。
    - lua_filter@phoneComment_Filter
    - lua_filter@abbrGloss_Filter                    # 流行固定英文缩写：中文第1、缩写第2
    # 2026-10-29 19:2x Qoder（H-274）：v45 注释排查卡顿那一版撤掉，恢复挂载。
    # 自调频/前三占位/注释/反查补位/联想限 5 全在这一层，注释掉等于整条能力消失。
    # 卡顿的账在 v3.3 已经改过：不再每窗口整表读 3.5 MB，改成按首字母只读一段（本机 253.6 → 18.0 ms）。
    - lua_filter@enWord_Filter
    # - lua_filter@Upper_Filter          # 三生输入法：英文首字母大写已回退，主人认为不大写也无所谓

  # H-260(CodeArts) v43: en_word 配置已移到 wubi_pinyin.schema.yaml 中（绕过 patch 机制）
  # v42 调频不生效，怀疑 patch 没有正确传递 en_word: 配置块

  custom_phrase:  # 设置用户字/词典
    dictionary: ""
    user_dict: Custom_phrase  # 指向 Custom_phrase.txt 文档
    db_class: stabledb
    enable_completion: false
    enable_sentence: true
    initial_quality: 1
  # recognizer/patterns/punct 只决定引擎是否把斜杠串认成符号码；
  # 本包无 punctuator/symbols 数据，符号输入走 App 符号面板（rawfile/symbols/symbols.json，H-061 已验）。
  # rawNum = 三生自加：/ 后面含数字的串（5g / b2b / pm2.5 / ri0977）交给 rawEcho_translator
  recognizer/patterns/punct: "^/([0-9]0?|[A-Za-z]+)$"
  recognizer/patterns/rawNum: "^/[A-Za-z0-9]*[0-9][A-Za-z0-9._+%-]*$"
  punctuator:  # 设置标点符号集
    import_preset: default
  
  # 设置以下 translator 相关的开关
  translator/enable_sentence: true          #是否整句连打
  translator/enable_user_dict: true         #开启用户词典
  translator/enable_encoder: true           #是否自动造词
  translator/encode_commit_history: true     #自动造词关键：把连续上屏的编码合并成词条（打「刚」「需」→下次 mqfd 出「刚需」）· DSH 2026-10-15
  translator/max_phrase_length: 6              # H-279(Qoder)：原 4 把 schema 里 DSH 2026-10-15 改的 6 又压回去了
                                               # （patch 覆盖 schema，5~6 字词一直造不出来）；口径对齐桌面端 schema 的 6
  
  translator/enable_completion: false         #关：编码提示会挤占候选（DSH 2026-10-15）

  # 简繁切换快捷键：Ctrl+Shift+F（三生输入法·简繁反查）
  key_binder/bindings/+:
    - when: always
      accept: Control+Shift+f
      toggle: zh_trad

# 简繁转换配置（F4 或 Ctrl+Shift+F 切换 zh_trad 开关：简体→繁體）
tradition:
  opencc_config: s2t.json
  option_name: zh_trad

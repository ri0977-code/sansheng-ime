# Generated by Qoder · 对齐桌面版 v1.10.3
# 安卓版说明：dependencies 保留 pinyin_simp —— 本包已自带 pinyin_simp.dict.yaml，
#   v1.0.0 当年是因为插件 rime-data 里没有该字典才砍掉反查，现在不再需要砍。
#   reverse_lookup（按 ` 切拼音）因此恢复可用。
# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi_pinyin
  name: "五笔·拼音"
  version: "1.10.3-android"
  author:
    - 發明人 王永民先生
  description: |
    五筆字型86版＋漢語拼音混合輸入＋中英雙向（三生输入法 · 安卓版 1.10.3-android）
  dependencies:
    - pinyin_simp

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 常用, 增廣 ]
  - name: ascii_punct
    states: [ 。，, ．， ]
  - name: zh_trad
    reset: 0
    states: [ 简体, 繁體 ]
  - name: phraseComment
    reset: 1
    states: [Off, commentOn]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - reverse_lookup_translator
    # 2026-10-22 性能修复：librime 每挂一个 lua_translator，每次按键都要跨一次 Lua
    # 边界并调用它一次，实测单个约 +10~13 ms，与脚本内容无关（空脚本也要钱）。
    # 十组码均值：3 个 translator + 11 个 filter = 44.0 ms/键，0 个 = 9.1 ms/键。
    # 依据 _probe/lag_report_20261022.txt。
    #   - inputShow_translator：功能与 inputShow_Filter 完全重复（同一张 candsWillBeShown
    #     表，Filter 第 221-233 行自己生成候选），删掉后「a→a」「Ni/He/ID…」输出逐一
    #     比对不变，零损失。
    #   - help_translator：只处理 /help 一个输入，14 条候选已搬进 lua/slash_translator.lua，
    #     与 /5g 原文通道合并成一个 translator，只付一次开销。用法不变。
    # 十个 lua_filter 全部保留（它们只在候选算完后跑一遍，合计约 9~11 ms）。
    # DSH 2026-10-14 补回：13号原有的三个中英互译 translator
    - table_translator@zh2en_wubi     # 中→英：打五笔码候选出英文
    - table_translator@en2zh_v2       # 英→中：打英文候选出中文
    - table_translator@zh2en_pinyin   # 中→英（拼音）：打拼音候选出英文
  filters:
    - simplifier@tradition
    - lua_filter@inputShow_Filter
    - lua_filter@phraseExt_Filter
    - lua_filter@dateTime_Filter
    - lua_filter@dynamicPhrase_Filter
    - lua_filter@phraseReplace_Filter
    - uniquifier
    - lua_filter@dic_4w_Filter
    - lua_filter@phraseComment_Filter
    - lua_filter@pinyinAdding_Filter
    - lua_filter@laneChangeAndSpace_Filter
    - lua_filter@Upper_Filter

speller:
  delimiter: " ;'"

translator:
  dictionary: wubi86
  enable_charset_filter: false        # 关：原为true，会滤掉英文候选（DSH 2026-10-13）
  enable_completion: false            # DSH 2026-10-14 恢复 v1.0.0 原值
  enable_sentence: true               # DSH 2026-10-14 恢复 v1.0.0 原值（关掉会导致造不出词）
  enable_encoder: true
  encode_commit_history: true
  enable_user_dict: true
  max_phrase_length: 6                # DSH 2026-10-15：v1.0.0为4，单变量改为6以支持5字词（金木水火土）
  user_dict: user
  db_class: tabledb
  disable_user_dict_for_patterns:
    - "^z.*$"

abc_segmentor:
  extra_tags:
    - reverse_lookup

# DSH 2026-10-14 补回：13号原有的三个中英互译 translator 配置
zh2en_wubi:
  dictionary: zh2en_wubi
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: -5      # 三生输入法：五笔码输入时中文优先，英文翻译候选置后
  comment_format:
    - xform/.+//

en2zh_v2:
  dictionary: en2zh_v2
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: -5      # 三生输入法：英文输入时中文释义仍可出现，但不压过中文候选
  comment_format:
    - xform/.+//

zh2en_pinyin:
  dictionary: zh2en_pinyin
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: -5      # 三生输入法：拼音输入时中文优先，英文候选置后
  comment_format:
    - xform/.+//

reverse_lookup:
  dictionary: pinyin_simp
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    # DSH 2026-10-15 加：明确的翻页键
    # 原因：default 预设里 comma 绑定的条件是 when: paging（仅翻页后有效），
    # 第一页按 , 无效；] 完全未绑定。
    - {accept: "minus", send: Page_Up, when: has_menu}
    - {accept: "equal", send: Page_Down, when: has_menu}

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
tradition:
  opencc_config: s2t.json
  option_name: zh_trad







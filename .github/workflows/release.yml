# Generated by DSH · 2026-10-13　·　三生输入法 v1.9 调整 · 2026-10-18
# 发布流水线：push `v*` 标签时触发
#
# 步骤：
#   1. 校验 install.bat 编码与首行（防闪退老坑）
#   2. 校验 rime/ 旧配置树依赖完整性（静态检查，无需运行 Rime）
#   3. 打印标签注释留档 —— 不再自动建 / 改 Release，见文件末尾说明（2026-10-21）
#
# v1.9 改动：不再自动打包 wubi-citong zip —— 成品已改成 NSIS 单文件
#   三生输入法-vX.Y-setup.exe（需 Windows + NSIS 才能编，CI 是 ubuntu 编不了），
#   由发布人手动上传到 Release 附件。
#
# 关键：GBK 版 bat 必须保持 GBK 编码 + CRLF 换行（仓库用 .gitattributes 锁定
# working-tree-encoding=GBK）；根目录 install.bat 是纯 ASCII，两种编码下字节一致。

name: Release

on:
  push:
    tags:
      - 'v*'
      # #63（2026-10-24）：安卓 / 同文试用版的 tag 也长成 v*（v1.10.4-android、
      # v1.10.3-trime-trial），以前每次发安卓都会把这条桌面流水线一起点着
      # （改前取证 _probe/ci63_before.txt：两个 tag 各触发 Release + Build installer）。
      # 只能用 tags 列表内的 ! 负向匹配：GitHub 明确规定 tags 与 tags-ignore
      # 不能同时出现在一个 on.push 里，写了 tags-ignore 整个文件解析失败，
      # 反而退化成「任何 push 都触发 + 秒失败空 run」（取证 _probe/ci63_bad_tagsignore.txt）。
      # build-inputs-* 一类 tag 不以 v 开头，本来就不匹配 v*，无需再排除。
      # 实证脚本 _probe/ci63_verify.py（负向 tag 0 条 run / 正向 tag 2 条 run）。
      - '!v*-android'
      - '!v*-trime-trial'
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 校验 install.bat 的编码（必须是 GBK）
        run: |
          # GBK 下「五」是 0xCE 0xC5；若被转成 UTF-8 则是 0xE4 0xB8 0xAD
          HEX=$(head -c 200 install.bat | xxd -p | tr -d '\n')
          if echo "$HEX" | grep -qi 'e4b8ad'; then
            echo "::error::install.bat 被转成 UTF-8 了，Windows 双击会乱码。检查 .gitattributes"
            exit 1
          fi
          # 首行必须是 @echo off（历史上被污染成 ?@echo off 导致闪退）
          FIRST=$(head -1 install.bat | tr -d '\r')
          if [ "$FIRST" != "@echo off" ]; then
            echo "::error::install.bat 首行是 [$FIRST]，应为 [@echo off]"
            exit 1
          fi
          echo "install.bat 编码与首行检查通过"

      - name: 校验安装包依赖完整性
        run: |
          python3 校验安装包.py .

      - name: 提取标签注释（留档用，不再写进 Release 正文）
        run: |
          git tag -l "v${GITHUB_REF#refs/tags/v}" --format='%(contents)' | head -40

      # 2026-10-21 v1.10.1 发布时发现：这一步会把「标签注释 + 自动生成的 commit 列表」
      # 追加到已经写好的 Release 正文后面。标签是用 API 建的轻量标签（注释为空），
      # 于是 git 里那条内部提交说明（含 INPUTS_SHA256 这类词）被原样贴到了用户看的发布页上。
      # 现在 Release 由发布人用 API 建、正文来自《发布页文本-*.md》、附件手动上传，
      # 所以这里不再创建或修改 Release —— 本流水线只保留上面两道校验门。
      # 复现记录：_probe/release_audit.txt；清理脚本：_probe/fix_release_bodies.py。

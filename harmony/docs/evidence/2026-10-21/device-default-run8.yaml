__build_info:
  rime_version: 1.16.1
  timestamps:
    "/data/storage/el2/base/haps/entry/files/rime/default": 1792566949
    "/data/storage/el2/base/haps/entry/files/rime/default.custom": 0
ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Control_L: noop
    Control_R: noop
    Shift_L: commit_code
    Shift_R: noop
config_version: 0.40
key_binder:
  bindings:
    - {accept: minus, send: Page_Up, when: has_menu}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: comma, send: Page_Up, when: paging}
    - {accept: period, send: Page_Down, when: has_menu}
    - {accept: bracketleft, send: Page_Up, when: has_menu}
    - {accept: bracketright, send: Page_Down, when: has_menu}
    - {accept: "Control+Shift+f", toggle: zh_trad, when: always}
  select_first_candidate:
    - Control_f
    - Control_y
menu:
  page_size: 50
punctuator:
  full_shape:
    " ": " "
    "!": "！"
    "\"": "“"
    "'": "’"
    "(": "（"
    ")": "）"
    ",": "，"
    .: "。"
    "/": "、"
    0: "０"
    1: "１"
    2: "２"
    3: "３"
    4: "４"
    5: "５"
    6: "６"
    7: "７"
    8: "８"
    9: "９"
    ":": "："
    ";": "；"
    "?": "？"
  half_shape:
    "!": "！"
    "\"": "“"
    "#": "#"
    "$": "$"
    "%": "%"
    "&": "&"
    "'": "’"

# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubi86_jidian_pinyin
  name: "拼音混输"
  version: "1.0"
  author:
    - 发明人 王永民先生
  description: |
    五笔字形 86 极点极爽版，方案由 KyleBing 修改 - 2019年11月08日 10:26
  dependencies:
    - pinyin_simp

switches:
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: extended_charset
    states: [ 常用, 扩展 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - table_translator
    - table_translator@en2zh_v2       # 英→中：打英文，候选出中文（DSH 2026-10-13）
    - table_translator@zh2en_wubi     # 中→英：打五笔码，候选出英文（DSH 2026-10-15）

speller:

translator:
  dictionary: wubi86_jidian_py           # 翻译器将调取此字典文件
  enable_charset_filter: false          # 关：true 会滤掉纯英文候选（DSH 2026-10-15）
  enable_completion: true               # 提前显示编码未输入完整的词条

  # 开启自动造词相关设置，将下面四项都改为 true
  enable_sentence: false                # 句子输入模式
  enable_user_dict: true                # 开启用户词典（自造词必需，DSH 2026-10-13）
  enable_encoder: true                  # 自动造词
  encode_commit_history: true           # 已上屏词自动成词（打"清"+"门"→造"清门"，DSH 2026-10-13）

  max_phrase_length: 10                 # 自动生成词的最大长度
  user_dict: user                       # 用户词典名
  db_class: tabledb                     # 用户词典类型 userdb - 二进制 / tabledb - 人类语言
  disable_user_dict_for_patterns:       # 不需要录入用户词典的编码
    - "^z.*$"


# 英→中：打英文，候选出中文（DSH 2026-10-13）
en2zh_v2:
  dictionary: en2zh_v2_py
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false
  initial_quality: 0.01       # 硬压英文到中文后（DSH 2026-10-13）
  comment_format:
    - xform/.+//


# 中→英：打五笔/拼音码，候选出英文（DSH 2026-10-15 补：此前只有英→中）
zh2en_wubi:
  dictionary: zh2en_wubi_py
  enable_charset_filter: false
  enable_completion: false
  enable_sentence: false
  enable_user_dict: false
  enable_encoder: false


# 输入的编码同时进行拼音反查，实现五笔与拼音的混输
abc_segmentor:
  extra_tags:
    - reverse_lookup

reverse_lookup:
  dictionary: pinyin_simp
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default

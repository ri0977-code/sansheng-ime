# Generated by DSH · 2026-10-13　·　三生输入法 v1.9 调整 · 2026-10-18
# 发布流水线：push `v*` 标签时触发
#
# 步骤：
#   1. 校验 install.bat 编码与首行（防闪退老坑）
#   2. 校验 rime/ 旧配置树依赖完整性（静态检查，无需运行 Rime）
#   3. 用标签注释作为 Release 说明，自动建 Release
#
# v1.9 改动：不再自动打包 wubi-citong zip —— 成品已改成 NSIS 单文件
#   三生输入法-vX.Y-setup.exe（需 Windows + NSIS 才能编，CI 是 ubuntu 编不了），
#   由发布人手动上传到 Release 附件。
#
# 关键：GBK 版 bat 必须保持 GBK 编码 + CRLF 换行（仓库用 .gitattributes 锁定
# working-tree-encoding=GBK）；根目录 install.bat 是纯 ASCII，两种编码下字节一致。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 校验 install.bat 的编码（必须是 GBK）
        run: |
          # GBK 下「五」是 0xCE 0xC5；若被转成 UTF-8 则是 0xE4 0xB8 0xAD
          HEX=$(head -c 200 install.bat | xxd -p | tr -d '\n')
          if echo "$HEX" | grep -qi 'e4b8ad'; then
            echo "::error::install.bat 被转成 UTF-8 了，Windows 双击会乱码。检查 .gitattributes"
            exit 1
          fi
          # 首行必须是 @echo off（历史上被污染成 ?@echo off 导致闪退）
          FIRST=$(head -1 install.bat | tr -d '\r')
          if [ "$FIRST" != "@echo off" ]; then
            echo "::error::install.bat 首行是 [$FIRST]，应为 [@echo off]"
            exit 1
          fi
          echo "install.bat 编码与首行检查通过"

      - name: 校验安装包依赖完整性
        run: |
          python3 校验安装包.py .

      - name: 提取标签注释作为发布说明
        run: |
          {
            echo "NOTES<<EOF"
            git tag -l "v${GITHUB_REF#refs/tags/v}" --format='%(contents)'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 创建 GitHub Release（附件由发布人手动上传 setup.exe）
        uses: softprops/action-gh-release@v3
        with:
          # 不要设 name: —— action 会把 tag 名作为标题、name 作为副标题，
          # 写 name: v${{ github.ref_name }} 就会显示成 "vv1.0.3"
          body: ${{ env.NOTES }}
          generate_release_notes: true
          append_body: true
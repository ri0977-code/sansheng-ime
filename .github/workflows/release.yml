# Generated by DSH · 2026-10-13
# 发布流水线：push `v*` 标签时触发
#
# 步骤：
#   1. 校验版本号与标签一致
#   2. 打包成品 zip（含 install.bat / rime/ / 使用说明/ / 校验安装包.py）
#   3. 用标签注释作为 Release 说明，自动附加 zip
#
# 关键：install.bat 必须保持 GBK 编码 + CRLF 换行。
# 仓库用 .gitattributes 锁定（working-tree-encoding=GBK），
# checkout 出来就是可双击的 GBK 脚本。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 校验 install.bat 的编码（必须是 GBK）
        run: |
          # GBK 下「五」是 0xCE 0xC5；若被转成 UTF-8 则是 0xE4 0xB8 0xAD
          HEX=$(head -c 200 install.bat | xxd -p | tr -d '\n')
          if echo "$HEX" | grep -qi 'e4b8ad'; then
            echo "::error::install.bat 被转成 UTF-8 了，Windows 双击会乱码。检查 .gitattributes"
            exit 1
          fi
          # 首行必须是 @echo off（历史上被污染成 ?@echo off 导致闪退）
          FIRST=$(head -1 install.bat | tr -d '\r')
          if [ "$FIRST" != "@echo off" ]; then
            echo "::error::install.bat 首行是 [$FIRST]，应为 [@echo off]"
            exit 1
          fi
          echo "install.bat 编码与首行检查通过"

      - name: 校验安装包依赖完整性
        run: |
          python3 校验安装包.py .

      - name: 打包成品 zip
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ZIP_NAME="wubi-citong-v${VERSION}.zip"
          STAGE="wubi-citong-v${VERSION}"
          mkdir -p "$STAGE"
          cp -r install.bat rime 校验安装包.py "$STAGE"/
          cp -r 使用说明 "$STAGE"/
          # 自造词原始备份不进包（个人数据），只保留硬依赖的主目录表
          rm -rf "$STAGE/rime/我的自造词_可选"
          (cd "$STAGE" && zip -r "../$ZIP_NAME" . -x '*.DS_Store')
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$ZIP_NAME"

      - name: 提取标签注释作为发布说明
        run: |
          {
            echo "NOTES<<EOF"
            git tag -l "v${GITHUB_REF#refs/tags/v}" --format='%(contents)'
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ env.GITHUB_REF_NAME }}
          body: ${{ env.NOTES }}
          generate_release_notes: true
          append_body: true
          files: ${{ env.ZIP_NAME }}